<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Smart Parking - Register</title>


<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">


<link rel="stylesheet"
href="{{ url_for('static', filename='css/style.css') }}">


<link rel="stylesheet"
href="{{ url_for('static', filename='css/animation.css') }}">


<style>

.parking-image{
    width:120px;
    height:120px;
    font-size:52px;
    border-radius:50%;
    border:4px solid white;
    box-shadow:0 0 20px cyan;
    animation: floatImage 3s infinite;
}


@keyframes floatImage{

    0%{
        transform:translateY(0px);
    }

    50%{
        transform:translateY(-15px);
    }

    100%{
        transform:translateY(0px);
    }

}


.image-title{

    color:white;
    font-size:28px;
    font-weight:bold;
    text-shadow:0 0 15px cyan;

}


</style>


</head>


<body>


<!-- Animated Background -->

<div class="background-animation">

<div class="circle c1"></div>
<div class="circle c2"></div>
<div class="circle c3"></div>
<div class="circle c4"></div>
<div class="circle c5"></div>

</div>



<!-- Moving Car -->

<div class="car">

🚗

</div>




<!-- Register Card -->

<div class="login-container">


<div class="login-box fade-in glow">


<div class="text-center">



<!-- Parking Icon -->

<div class="parking-image d-flex align-items-center justify-content-center">

🚘

</div>


<h2 class="image-title mt-3">

🚘 AI Smart Parking System

</h2>


<p class="text-light">

Create Your Account

</p>


</div>


{% if error %}

<div class="alert alert-danger text-center">

{{ error }}

</div>

{% endif %}




<form method="POST" onsubmit="return validateRegister()">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>



<div class="mb-3">

<label class="form-label">

👤 Full Name

</label>


<input

type="text"

id="name"

name="name"

class="form-control"

placeholder="Enter your full name"

required>

</div>





<div class="mb-3">

<label class="form-label">

📧 Email Address

</label>


<input

type="email"

id="email"

name="email"

class="form-control"

placeholder="Enter your email"

required>


</div>





<div class="mb-3">

<label class="form-label">

📱 Phone Number

</label>


<input

type="tel"

id="phone"

name="phone"

class="form-control"

placeholder="Enter your mobile number">


</div>





<div class="mb-3">

<label class="form-label">

🔒 Password

</label>


<input

type="password"

id="password"

name="password"

class="form-control"

placeholder="Create Password"

required>


</div>





<div class="mb-3">


<label class="form-label">

🔒 Confirm Password

</label>


<input

type="password"

id="confirm_password"

name="confirm_password"

class="form-control"

placeholder="Confirm Password"

required>


</div>






<div class="form-check mb-3">


<input

class="form-check-input"

type="checkbox"

id="showPassword"

onclick="togglePassword()">



<label class="form-check-label text-light">

👁 Show Password

</label>


</div>





<div class="d-grid">


<button

type="submit"

class="btn btn-success glow-button">

📝 Create Account

</button>


</div>



</form>






<hr class="text-light">





<div class="text-center">


<p class="text-light">

Already have an account?

</p>



<a href="/login"

class="btn btn-primary glow-button">

🔐 Login

</a>



<br><br>



<a href="/"

class="btn btn-outline-light">

🏠 Back to Home

</a>



</div>







<br>



<div class="footer">


<p class="text-light">

© 2026 AI Smart Parking System

</p>


<p class="text-light">

Powered by Flask • Python • AI • IoT

</p>


</div>



</div>

</div>






<!-- Floating Particles -->


<div class="particle p1"></div>

<div class="particle p2"></div>

<div class="particle p3"></div>

<div class="particle p4"></div>

<div class="particle p5"></div>





<script>


function validateRegister(){


let name=document.getElementById("name").value.trim();

let email=document.getElementById("email").value.trim();

let phone=document.getElementById("phone").value.trim();

let password=document.getElementById("password").value;

let confirm=document.getElementById("confirm_password").value;



if(name.length < 3){

alert("Name must contain at least 3 characters.");

return false;

}



if(email==""){

alert("Please enter your email.");

return false;

}



if(phone!="" && phone.length!=10){

alert("Phone number must contain 10 digits.");

return false;

}

// Password strength validation
if(password.length < 8){

alert("Password must be at least 8 characters long.");

return false;

}

if(!/[A-Z]/.test(password)){

alert("Password must contain at least one uppercase letter.");

return false;

}

if(!/[a-z]/.test(password)){

alert("Password must contain at least one lowercase letter.");

return false;

}

if(!/[0-9]/.test(password)){

alert("Password must contain at least one digit.");

return false;

}







if(password != confirm){

alert("Passwords do not match.");

return false;

}



return true;


}






function togglePassword(){


let password=document.getElementById("password");

let confirm=document.getElementById("confirm_password");



if(password.type==="password"){


password.type="text";

confirm.type="text";


}

else{


password.type="password";

confirm.type="password";


}


}




window.onload=function(){

console.log("AI Smart Parking Register Loaded");

}



</script>




<script src="{{ url_for('static', filename='js/animation.js') }}"></script>



</body>

</html>
